name: build

# The check on every push to main, every pull request and on demand, sized to the change: documentation alone
# (Markdown, the licences, the ignore file, the editor settings, the hooks) builds nothing; anything else builds the
# host and runs every suite on the three platforms - Linux with gcc (and again under AddressSanitizer and
# UndefinedBehaviorSanitizer), Windows with MSVC, macOS universal - measures coverage, and makes each platform's
# packages unsigned as release.yml makes them (the Linux zip and Debian package, the Windows installer installed and
# taken away, the macOS package), each held to its stage with every bundled engine answering from its place in it; the
# formatting is checked whatever changed. The last job, "CI", is the one check to require: green when every job the run
# needed passed or was not needed, red when any failed or was cancelled.
#
# Every job runs on a GitHub-hosted runner (free for a public repository), its image pinned by version rather than
# -latest: ubuntu-24.04, windows-2025 (Visual Studio's MSVC, PowerShell 7 and Git's bash) and macos-15 (Apple silicon,
# Xcode's clang building both slices). Each job starts on a fresh machine and builds from nothing, every FetchContent
# pin fetched afresh and held to its hash; .github/actions/cpp installs the toolchain.
#
# The version every binary reports is MAJOR.MINOR.BUILD from the nearest vMAJOR.MINOR tag
# (cmake/AmphitheaterVersion.cmake), which a shallow clone cuts off: every checkout is fetch-depth 0.
#
# The window is built on the toolkit, a git submodule (reckless-technology/reckless-toolkit at external/reckless-toolkit)
# in a private repository the workflow's token cannot read. Every job that builds checks it out right after its own
# checkout through .github/actions/toolkit, over SSH with the toolkit's read-only deploy key (the secret
# RECKLESS_TOOLKIT_DEPLOY_KEY; on Windows through Git's bash and its ssh), at the commit this repository pins; the changes
# job also holds that commit to the toolkit's main. The window's suites (CTest label window) need a display: Linux runs
# them under xvfb-run, macOS on the runner's window server, Windows on its runner's window station, which draws though
# nothing shows; the sanitizer and coverage jobs leave them out.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token reads the repository and nothing else: a pull request's code runs with it.
permissions:
  contents: read

# One run per branch or pull request at a time: a new push supersedes the run its predecessor started.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job's launch, suite or smoke run reaches the network for the update check, as on every product's runners.
env:
  RECKLESS_UPDATE_CHECK: "off"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.pick.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit at the commit this change pins, which must be on the toolkit's main: a bump points at a commit the
      # toolkit has merged, never at one only a branch of it holds, which could be rewritten under a commit here.
      - name: The toolkit submodule, at a commit on the toolkit's main
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
          require-on-main: "true"
      - name: Decide what this run needs
        id: pick
        shell: bash
        run: |
          cpp=true
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$GITHUB_SHA")
            echo "changed files:"; echo "$changed"
            # Documentation never reaches a compiler: Markdown, the licences, the ignore file, the editor settings,
            # the hooks.
            if ! echo "$changed" | grep -qvE '[.]md$|^LICENSE$|^[.]gitignore$|^[.]vscode/|^[.]githooks/'; then
              cpp=false
            fi
          fi
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "code changed: $cpp"

  # ---- The host ---------------------------------------------------------------------------------------------------

  linux:
    name: Linux (gcc)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit, the submodule at external/reckless-toolkit, at its pinned commit (.github/actions/toolkit).
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci-linux --target amphitheater_everything -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: ctest --test-dir build/ci-linux --output-on-failure -j "$(nproc)" -LE '^window$'
      # The window's suites (label window) on a display of their own, one at a time.
      - name: Test the window on a display (xvfb-run)
        run: xvfb-run -a -s "-screen 0 1600x1200x24" ctest --test-dir build/ci-linux --output-on-failure -L '^window$'
      # The release's two Linux packages, unsigned, from this tree, as release.yml makes them: the stage (each bundled
      # engine downloaded by its pin, held to its hash and answering its handshake), the portable
      # zip and the Debian package, each held to the stage and every engine started from its place in it; then dropped.
      - name: Package (the stage, the zip and the Debian package)
        run: |
          set -euo pipefail
          for tool in python3 dpkg-deb dpkg objdump ldconfig zip unzip; do
            command -v "$tool" > /dev/null || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          version=$(sed -n 's/.*AMPHITHEATER_VERSION_STRING "\(.*\)"/\1/p' build/ci-linux/generated/AmphitheaterVersion.h)
          rm -rf build/ci-linux-dist build/ci-linux-out
          python3 -I packaging/stage.py build/ci-linux build/ci-linux-dist linux --leave-out-unfit
          packaging/linux/make-zip.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-amphitheater-$version-linux-x64.zip"
          packaging/linux/make-deb.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-amphitheater-$version-linux-amd64.deb"
          packaging/linux/test-deb.sh build/ci-linux-dist "$version" "build/ci-linux-out/reckless-amphitheater-$version-linux-amd64.deb"
          rm -rf build/ci-linux-dist build/ci-linux-out

  sanitizers:
    name: Linux sanitizers (address, undefined)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit, the submodule at external/reckless-toolkit, at its pinned commit (.github/actions/toolkit).
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAMPHITHEATER_ASAN=ON
          "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci-asan --target amphitheater_everything -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/ci-asan --output-on-failure -j "$(nproc)" -LE '^window$'

  # Coverage of the host's own code (src/), gcc's, read by gcovr: a debug build instrumented, every suite run, and the
  # run red under 90 % of lines. The app's entry point (src/app/Main.cpp) is left out: it opens a window, which this
  # job has no display for; the app's smoke run is the window suites'. The report is kept with the run.
  coverage:
    name: Coverage (Linux)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit, the submodule at external/reckless-toolkit, at its pinned commit (.github/actions/toolkit).
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: gcovr 8.3
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --quiet gcovr==8.3
      - name: Configure
        run: >
          cmake -S . -B build/ci-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAMPHITHEATER_COVERAGE=ON
          "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci-coverage --target amphitheater_everything -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: ctest --test-dir build/ci-coverage --output-on-failure -j "$(nproc)" -LE '^window$'
      - name: Coverage, 90 % of lines or red
        run: >
          mkdir -p build/ci-coverage/coverage &&
          "$RUNNER_TEMP/gcovr/bin/gcovr" --root . --filter 'src/' --exclude 'src/app/Main[.]cpp' build/ci-coverage
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --print-summary --txt build/ci-coverage/coverage.txt --html-details build/ci-coverage/coverage/index.html
          --fail-under-line 90
      - name: The report
        if: always()
        run: cat build/ci-coverage/coverage.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: build/ci-coverage/coverage
          if-no-files-found: ignore
          retention-days: 1

  windows:
    name: Windows (MSVC)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit, the submodule at external/reckless-toolkit, at its pinned commit (.github/actions/toolkit).
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci-windows --target amphitheater_everything -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: ctest --test-dir build/ci-windows --output-on-failure -j $env:NUMBER_OF_PROCESSORS
      # The Windows installer, unsigned, from this tree: the stage (each bundled engine downloaded by its pin, held to its
      # hash and answering its handshake with nothing but the system on its PATH; an engine whose release imports a DLL a
      # fresh Windows lacks left out with a warning, where a release stops), then a test build of the installer installed for the runner's account under
      # a folder of its own, every file and engine checked at its place, upgraded and uninstalled
      # (packaging/windows/test-installer.ps1); then dropped. release.yml makes and signs the real one.
      - name: Package (the stage and the installer, installed and taken away)
        shell: pwsh
        run: |
          $version = (Select-String -Path build/ci-windows/generated/AmphitheaterVersion.h -Pattern 'VERSION_STRING "(.*)"').Matches[0].Groups[1].Value
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build/ci-windows-dist
          & "${{ steps.cpp.outputs.python }}" -I packaging/stage.py build/ci-windows build/ci-windows-dist windows --leave-out-unfit
          if ($LASTEXITCODE -ne 0) { throw "the stage failed" }
          pwsh -NoProfile -File packaging/windows/test-installer.ps1 -DistDir build/ci-windows-dist -Version $version `
            -Python "${{ steps.cpp.outputs.python }}"
          if ($LASTEXITCODE -ne 0) { throw "the installer's test failed" }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build/ci-windows-dist

  macos:
    name: macOS (universal)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolkit, the submodule at external/reckless-toolkit, at its pinned commit (.github/actions/toolkit).
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      - name: Toolchain
        id: cpp
        uses: ./.github/actions/cpp
      - name: Configure
        run: >
          cmake -S . -B build/ci-macos -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 "-DPython3_EXECUTABLE=${{ steps.cpp.outputs.python }}"
      - name: Build
        run: cmake --build build/ci-macos --target amphitheater_everything -j ${{ steps.cpp.outputs.jobs }}
      - name: Every binary holds arm64 and x86_64, for macOS 13.3 on
        run: |
          for binary in build/ci-macos/src/cli/amphitheater-cli build/ci-macos/tests/amphitheater_*                         build/ci-macos/src/app/Amphitheater.app/Contents/MacOS/Amphitheater; do
            lipo -info "$binary"
            for arch in arm64 x86_64; do lipo "$binary" -verify_arch "$arch"; done
            [ "$(vtool -show-build "$binary" | awk '/minos/ {print $2}' | sort -u)" = 13.3 ] || { echo "::error::$binary is not for macOS 13.3"; exit 1; }
          done
          # The x86_64 slice runs too, under Rosetta, as release.yml runs it.
          arch -x86_64 build/ci-macos/src/cli/amphitheater-cli --version
      # The app's bundle as the system checks it: signed whole, a plist that names its icon - the icon it names in the
      # bundle, the host's own black queen (assets/icon/Icon.icns) byte for byte - and asks for nothing the host does
      # not use (no microphone).
      - name: The app's bundle
        run: |
          app=build/ci-macos/src/app/Amphitheater.app
          codesign --verify --deep --strict "$app"
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist") ||
            { echo "::error::the plist names no icon"; exit 1; }
          [ -f "$app/Contents/Resources/$icon" ] || { echo "::error::the bundle has no $icon, which its plist names"; exit 1; }
          cmp "$app/Contents/Resources/$icon" assets/icon/Icon.icns ||
            { echo "::error::the bundle's $icon is not assets/icon/Icon.icns"; exit 1; }
          echo "the bundle's icon: $icon, $(wc -c < "$app/Contents/Resources/$icon") bytes, assets/icon/Icon.icns"
          if /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist" 2> /dev/null; then
            echo "::error::the plist asks for the microphone"; exit 1
          fi
      - name: Test
        env:
          RECKLESS_REQUIRE_WINDOW: "1"
        run: ctest --test-dir build/ci-macos --output-on-failure -j "$(sysctl -n hw.ncpu)"
      # The macOS installer, unsigned, from this tree: the stage (each bundled engine downloaded by its pin, held to its
      # hash and answering its handshake, the app signed again ad hoc round them), the package made and held to the
      # stage with every engine started from its place in it (packaging/macos/test-installer.sh); then dropped.
      # release.yml signs, notarises and staples the real one.
      - name: Package (the stage and the installer)
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*AMPHITHEATER_VERSION_STRING "\(.*\)"/\1/p' build/ci-macos/generated/AmphitheaterVersion.h)
          rm -rf build/ci-macos-dist build/ci-macos-out
          "${{ steps.cpp.outputs.python }}" -I packaging/stage.py build/ci-macos build/ci-macos-dist macos --leave-out-unfit
          packaging/macos/make-installer.sh build/ci-macos-dist "$version" "build/ci-macos-out/reckless-amphitheater-$version-macos.pkg"
          packaging/macos/test-installer.sh build/ci-macos-dist "$version" "build/ci-macos-out/reckless-amphitheater-$version-macos.pkg"
          rm -rf build/ci-macos-dist build/ci-macos-out

  # Every C++ file clang-format clean under the repository's .clang-format, with 22.1.8 from the PyPI wheel (the one
  # version every Reckless repository formats with), in a venv of the job's own.
  format:
    name: clang-format
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: clang-format 22.1.8
        run: |
          venv="$RUNNER_TEMP/clang-format"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet 'clang-format==22.1.8'
          "$venv/bin/clang-format" --version
          files=$(git ls-files -- '*.h' '*.cpp' || true)
          echo "$(echo "$files" | grep -c . || true) files"
          if [ -n "$files" ]; then "$venv/bin/clang-format" --dry-run -Werror $files; fi

  # The one check to require: always runs, after everything, and reads the others' results.
  ci:
    name: CI
    needs: [changes, linux, sanitizers, coverage, windows, macos, format]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job this run needed passed
        shell: bash
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "A job failed or was cancelled." >&2
            exit 1
          fi
          echo "Green."
