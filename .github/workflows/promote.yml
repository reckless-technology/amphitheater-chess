name: promote

# A release reaches the public only when it is promoted. This repository is public, so release.yml leaves each of its
# releases a draft, which only the repository's collaborators see; promote publishes a finished one - its four packages
# on it and its tag pushed - here, in place, as Knect 4 and Reckless Sudoku publish theirs from their own repositories.
# Run it by hand with the tag, only on Jonny's word:
#
#   gh workflow run promote.yml --ref main -f tag=v1.0.3                    # promote
#   gh workflow run promote.yml --ref main -f tag=v1.0.3 -f dry_run=true    # gather and check, publish nothing
#
# Beside the three installers and the portable Linux zip, under their versioned names, it uploads them again under four
# fixed ones - reckless-amphitheater-macos.pkg, reckless-amphitheater-win64-setup.exe,
# reckless-amphitheater-linux-amd64.deb and reckless-amphitheater-linux-x64.zip - so releases/latest/download/<name> is
# always the newest; and SHA256SUMS, every file's checksum, which the download page shows. It sets the release's title
# and its notes, release-notes.md at the tag, and publishes it. The release is marked latest unless this repository
# already has a newer one published, so promoting an older tag after a newer one never moves releases/latest - and
# with it the website's downloads and the update manifest - backwards. Then it wakes the website's deploy (a
# repository_dispatch, amphitheater-release), which reads the newest public release here and builds the download page
# and updates/amphitheater.json, the manifest the host's update check reads (src/app/Main.cpp) - so nothing on the
# website is edited for a release; its daily deploy catches a wake that failed.
#
# Every installer carries the five bundled chess engines, GPLv3 programs whose corresponding source the notices point
# at in each engine's own public repository, at the tag the installer carries.
#
# The job runs on a GitHub-hosted runner, ubuntu-24.04, a fresh machine each run. Everything here is done with the
# workflow's token, which sees, uploads to and publishes a draft only with Contents write. The wake alone needs the
# organization's secret PUBLIC_RELEASES_TOKEN (Contents write on reckless-technology/website, which a repository_dispatch
# needs); it is checked before anything is uploaded. A tag already published is refused. An attempt that failed
# part-way leaves the draft a draft, perhaps with some of the fixed-name files on it: the next attempt uploads them
# again over those (--clobber), so nothing needs clearing by hand.
#
# Releases up to 1.2.7 were promoted by copying them to reckless-technology/amphitheater-releases, which is archived,
# not deleted, so links to those copies still work.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to promote, a finished draft here: vMAJOR.MINOR.BUILD"
        required: true
      dry_run:
        description: "Gather and check the files, publish nothing"
        type: boolean
        default: false

# Contents write: the workflow's token sees a draft release, uploads to it and publishes it only with it.
permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # A finished release: release.yml pushes the tag only once all four packages are on the draft, so a draft whose
      # tag is not pushed is one a run left part-way. One already published has been promoted. The packages themselves
      # are held to the four below.
      - name: The tag is a finished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vMAJOR.MINOR.BUILD"; exit 1; }
          is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) ||
            { echo "::error::no release $TAG here, draft or published"; exit 1; }
          [ "$is_draft" = "true" ] || { echo "::error::$TAG is published already"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .ref > /dev/null 2>&1 ||
            { echo "::error::$TAG is not pushed: release.yml has not finished it"; exit 1; }
          echo "$TAG here: a draft, its tag pushed"
      # The wake's token, checked before anything is uploaded. GitHub has no read-only way to ask what a fine-grained
      # token may write - .permissions reports its owner's role - so this proves the token reaches the private
      # website at all; one that can read but not write is found out at the wake, which only warns.
      - name: The token reaches the website
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::the secret PUBLIC_RELEASES_TOKEN is not set (the workflow's head says what it needs)"; exit 1; }
          gh api repos/reckless-technology/website --jq .full_name > /dev/null 2>&1 ||
            { echo "::error::PUBLIC_RELEASES_TOKEN cannot reach reckless-technology/website: it needs Contents write there"; exit 1; }
      - name: The release's files and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          rm -rf promote promote-notes.md && mkdir promote
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir promote \
            --pattern "reckless-amphitheater-$version-macos.pkg" \
            --pattern "reckless-amphitheater-$version-win64-setup.exe" \
            --pattern "reckless-amphitheater-$version-linux-amd64.deb" \
            --pattern "reckless-amphitheater-$version-linux-x64.zip"
          for file in "reckless-amphitheater-$version-macos.pkg" "reckless-amphitheater-$version-win64-setup.exe" \
                      "reckless-amphitheater-$version-linux-amd64.deb" "reckless-amphitheater-$version-linux-x64.zip"; do
            [ -s "promote/$file" ] || { echo "::error::$TAG has no $file"; exit 1; }
          done
          cp "promote/reckless-amphitheater-$version-macos.pkg" promote/reckless-amphitheater-macos.pkg
          cp "promote/reckless-amphitheater-$version-win64-setup.exe" promote/reckless-amphitheater-win64-setup.exe
          cp "promote/reckless-amphitheater-$version-linux-amd64.deb" promote/reckless-amphitheater-linux-amd64.deb
          cp "promote/reckless-amphitheater-$version-linux-x64.zip" promote/reckless-amphitheater-linux-x64.zip
          gh api "repos/$GITHUB_REPOSITORY/contents/release-notes.md?ref=$TAG" --jq .content | base64 -d > promote-notes.md
          [ -s promote-notes.md ] || { echo "::error::$TAG has no release-notes.md"; exit 1; }
          (cd promote && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS promote/SHA256SUMS
          cat promote/SHA256SUMS
          ls -l promote
          echo "--- the notes ---"
          cat promote-notes.md
      # releases/latest is what the website's downloads and the update manifest follow, so a tag older than this
      # repository's newest published release is published without taking the mark from it. Drafts and pre-releases
      # never count, so only what has been promoted does.
      - name: Whether it becomes the latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest version published here, from the whole list: a failure to read it fails the step rather than be
          # taken for "none", which would mark an older tag latest.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          latest=$(printf '%s\n' "$published" | sed '/^$/d' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "::warning::$TAG is older than the newest release published here, $latest: it is published without being marked latest"
            echo "flag=--latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG becomes the latest release (now: ${latest:-none})"
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi
      # The fixed names and SHA256SUMS onto the draft (again over any an earlier attempt left), then the title and the
      # notes set and the draft published in the same call, so the release is never public without all its files.
      - name: Published
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.flag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            promote/reckless-amphitheater-macos.pkg promote/reckless-amphitheater-win64-setup.exe \
            promote/reckless-amphitheater-linux-amd64.deb promote/reckless-amphitheater-linux-x64.zip \
            promote/SHA256SUMS
          on_release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in promote/*; do
            grep -qxF "${file#promote/}" <<< "$on_release" ||
              { echo "::error::${file#promote/} is not on $TAG after the upload; it stays a draft"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Reckless Amphitheater ${TAG#v}" \
            --notes-file promote-notes.md --draft=false "$LATEST"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq '"draft: \(.isDraft)  \(.url)"'
      - name: The website told
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          gh api repos/reckless-technology/website/dispatches -f event_type=amphitheater-release ||
            echo "::warning::the website was not woken; its daily deploy will pick $TAG up"
