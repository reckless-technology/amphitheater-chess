name: C++ toolchain
description: >
  What every C++ job of the host needs on a GitHub-hosted runner, a fresh machine each job: on Linux (ubuntu-24.04) the
  image's g++, CMake and pkg-config, with Ninja, the libraries the window's toolkit links (X11, FreeType, fontconfig)
  and Xvfb installed from apt; on macOS (macos-15) Xcode's clang and the image's CMake, with Homebrew's Ninja where the
  image has none; on Windows (windows-2025) the MSVC developer environment of the Visual Studio vswhere finds, exported
  to the job's later steps; on every platform Python 3.13 (actions/setup-python) holding tools/requirements.txt, for
  the packaging scripts and the suites, so the suites' icon and pieces checks run rather than skip. FetchContent fetches
  GoogleTest, Skia's prebuilt libraries and the toolkit's other dependencies into each build tree afresh, every one
  held to its hash: 5 to 20 seconds of a job's several minutes on the hosted runners, too little for an Actions cache
  of them to be worth keeping.
outputs:
  jobs:
    description: The build's parallelism for this runner
    value: ${{ steps.unix.outputs.jobs || steps.windows.outputs.jobs }}
  python:
    description: The Python the packaging scripts and the suites run with, tools/requirements.txt installed
    value: ${{ steps.python.outputs.python-path }}
runs:
  using: composite
  steps:
    # Python 3.10 or later is what tools/requirements.txt's wheels are built for; the build itself needs none, the icon
    # and the pieces being committed.
    - name: Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Toolchain (Linux, macOS)
      if: runner.os != 'Windows'
      id: unix
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        set -euo pipefail
        if [ "$(uname -s)" = "Linux" ]; then
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ninja-build pkg-config libx11-dev libfreetype-dev libfontconfig1-dev xvfb xauth > /dev/null
          for tool in g++ cmake ninja pkg-config xvfb-run; do
            command -v "$tool" > /dev/null || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          for library in x11 freetype2 fontconfig; do
            pkg-config --exists "$library" || { echo "::error::pkg-config finds no $library"; exit 1; }
          done
          mem_gb=$(( $(grep MemTotal /proc/meminfo | awk '{print $2}') / 1048576 ))
          # A job per two thirds of a gigabyte, never more than the cores.
          jobs=$(( mem_gb * 2 / 3 )); [ "$jobs" -gt "$(nproc)" ] && jobs=$(nproc); [ "$jobs" -lt 1 ] && jobs=1
          echo "$(nproc) cores, $mem_gb GB, $(. /etc/os-release && echo "$PRETTY_NAME"); $(g++ --version | head -1)"
        else
          command -v ninja > /dev/null || brew install --quiet ninja
          for tool in clang cmake ninja xcrun lipo vtool; do
            command -v "$tool" > /dev/null || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          jobs=$(sysctl -n hw.ncpu)
          echo "$(uname -m), $jobs cores, macOS $(sw_vers -productVersion); Xcode at $(xcode-select -p); $(clang --version | head -1)"
        fi
        "$PYTHON" -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
        "$PYTHON" -c "import resvg_py, PIL, svgelements, pathops"
        echo "the scripts' Python: $("$PYTHON" --version), tools/requirements.txt installed"
        cmake --version | head -1; echo "ninja $(ninja --version)"
        echo "build jobs: $jobs"
        echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

    - name: Toolchain (Windows)
      if: runner.os == 'Windows'
      id: windows
      shell: pwsh
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "No Visual Studio with the x64 C++ tools found" }
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
        $changed = @{}
        cmd.exe /c "`"$devcmd`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) { $changed[$Matches[1]] = $Matches[2] }
        }
        foreach ($name in $changed.Keys) {
          "$name=$($changed[$name])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          [Environment]::SetEnvironmentVariable($name, $changed[$name])
        }
        "Visual Studio: $vs; MSVC $env:VCToolsVersion; $env:NUMBER_OF_PROCESSORS cores"
        cmake --version | Select-Object -First 1; "ninja $(ninja --version)"
        & $env:PYTHON -m pip install --quiet --disable-pip-version-check -r tools/requirements.txt
        if ($LASTEXITCODE -ne 0) { throw "tools/requirements.txt could not be installed" }
        & $env:PYTHON -c "import resvg_py, PIL, svgelements, pathops"
        if ($LASTEXITCODE -ne 0) { throw "the scripts' Python lacks a package of tools/requirements.txt" }
        "the scripts' Python: $(& $env:PYTHON --version), tools/requirements.txt installed"
        "build jobs: $env:NUMBER_OF_PROCESSORS"
        "jobs=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_OUTPUT
