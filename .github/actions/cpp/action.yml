name: C++ toolchain
description: >
  What every C++ job of the host needs on a self-hosted runner: on Linux g++, CMake and Ninja, and the libraries the
  window's toolkit links (X11, FreeType, fontconfig, found by pkg-config) with xvfb for a display, installed with the
  runner's passwordless sudo where they are missing; on macOS Xcode's clang and Homebrew's CMake and Ninja; on Windows
  the MSVC developer environment of the Visual Studio vswhere finds, exported to the job's later steps; on macOS and
  Windows a Python with Pillow, which renders the app's icon, in a venv under the tool cache; and a directory under the
  runner's tool cache, keyed by compiler, where FetchContent keeps GoogleTest, Skia and the toolkit's other fetches
  between runs.
outputs:
  deps:
    description: The FetchContent directory for this runner's compiler
    value: ${{ steps.unix.outputs.deps || steps.windows.outputs.deps }}
  jobs:
    description: The build's parallelism for this runner
    value: ${{ steps.unix.outputs.jobs || steps.windows.outputs.jobs }}
  python:
    description: The Python with Pillow the app's icon is rendered with (macOS, Windows); empty on Linux
    value: ${{ steps.unix.outputs.python || steps.windows.outputs.python }}
runs:
  using: composite
  steps:
    - name: Toolchain (Linux, macOS)
      if: runner.os != 'Windows'
      id: unix
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(uname -s)" = "Linux" ]; then
          apt_line="build-essential cmake ninja-build pkg-config libx11-dev libfreetype-dev libfontconfig1-dev xvfb xauth"
          find_missing() {
            missing=""
            for tool in g++ cmake ninja pkg-config xvfb-run; do
              command -v "$tool" > /dev/null || missing="$missing $tool"
            done
            if command -v pkg-config > /dev/null; then
              for library in x11 freetype2 fontconfig; do pkg-config --exists "$library" || missing="$missing $library"; done
            fi
          }
          find_missing
          if [ -n "$missing" ] && sudo -n true 2> /dev/null; then
            echo "the runner lacks:$missing - installing with the runner's passwordless sudo"
            sudo -n apt-get update -qq
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $apt_line
            find_missing
          fi
          if [ -n "$missing" ]; then echo "::error::the runner lacks:$missing. sudo apt install $apt_line"; exit 1; fi
          compiler="gcc$(g++ -dumpversion | cut -d. -f1)"
          mem_gb=$(( $(grep MemTotal /proc/meminfo | awk '{print $2}') / 1048576 ))
          # A job per two thirds of a gigabyte, never more than the cores.
          jobs=$(( mem_gb * 2 / 3 )); [ "$jobs" -gt "$(nproc)" ] && jobs=$(nproc); [ "$jobs" -lt 1 ] && jobs=1
          echo "$(nproc) cores, $mem_gb GB, $(. /etc/os-release && echo "$PRETTY_NAME"); $(g++ --version | head -1)"
        else
          for tool in clang cmake ninja xcrun lipo vtool; do
            command -v "$tool" > /dev/null || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          compiler="appleclang$(clang --version | sed -nE '1s/.*version ([0-9]+).*/\1/p')"
          jobs=$(sysctl -n hw.ncpu)
          echo "$(uname -m), $jobs cores, macOS $(sw_vers -productVersion); $(clang --version | head -1)"
          # The app's icon is rendered by a Python with Pillow: a venv of the runner's own Python, kept.
          venv="$RUNNER_TOOL_CACHE/reckless-uci-host-pillow"
          if ! "$venv/bin/python" -c "import PIL" 2> /dev/null; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet Pillow
          fi
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "the app's icon: $("$venv/bin/python" --version) with Pillow"
        fi
        cmake --version | head -1; echo "ninja $(ninja --version)"
        deps="$RUNNER_TOOL_CACHE/reckless-uci-host-deps/$compiler-ninja"
        mkdir -p "$deps"
        echo "dependencies: $deps; build jobs: $jobs"
        { echo "deps=$deps"; echo "jobs=$jobs"; } >> "$GITHUB_OUTPUT"

    - name: Toolchain (Windows)
      if: runner.os == 'Windows'
      id: windows
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "No Visual Studio with the x64 C++ tools found" }
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
        $changed = @{}
        cmd.exe /c "`"$devcmd`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) { $changed[$Matches[1]] = $Matches[2] }
        }
        foreach ($name in $changed.Keys) {
          "$name=$($changed[$name])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          [Environment]::SetEnvironmentVariable($name, $changed[$name])
        }
        "Visual Studio: $vs; MSVC $env:VCToolsVersion; $env:NUMBER_OF_PROCESSORS cores"
        cmake --version | Select-Object -First 1; "ninja $(ninja --version)"
        $deps = Join-Path $env:RUNNER_TOOL_CACHE "reckless-uci-host-deps\msvc$env:VCToolsVersion-ninja"
        New-Item -ItemType Directory -Force -Path $deps | Out-Null
        "dependencies: $deps"
        "deps=$deps" >> $env:GITHUB_OUTPUT
        "jobs=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_OUTPUT
        # The app's icon is rendered by a Python with Pillow: a venv of the runner's machine-wide Python, kept.
        $venv = Join-Path $env:RUNNER_TOOL_CACHE 'reckless-uci-host-pillow'
        $python = Join-Path $venv 'Scripts/python.exe'
        $hasPillow = $false
        if (Test-Path $python) { & $python -c "import PIL" 2> $null; $hasPillow = ($LASTEXITCODE -eq 0) }
        if (-not $hasPillow) {
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "No Python on the runner to make the icon's venv with" }
          & $python -m pip install --quiet Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow did not install" }
        }
        "the app's icon: $(& $python --version) with Pillow"
        "python=$python" >> $env:GITHUB_OUTPUT
